  - id: memory_decay_phase_b
    name: "記憶減衰 Phase B: 連想リフレッシュ"
    description: |
      memory_search ヒット時に関連記憶のimportanceを自動リフレッシュ。
      core:* タグは減衰なし・リフレッシュのみ。
