    status: backlog
    depends_on: memory_decay_phase_a
    design_ref: "reports/cmd_622_memory_decay_design.md"

  - id: memory_decay_phase_c
    name: "記憶減衰 Phase C: stats拡張 + effective_importance削除"
    description: |
      memory_stats に減衰対象件数・次回減衰予定を追加。
